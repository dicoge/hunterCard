name: DIC-1037 Vercel Function Diagnostic

# TEMPORARY read-only diagnostic for the DIC-1037 /api outage investigation.
# Runs on the PR itself (pull_request synchronize) so it can inspect the
# PR's auto-created Vercel preview deployment: real deployment config (was
# vercel.json honored?), /api/hello timing, and Vercel runtime logs (did the
# Node function even boot?). Remove this workflow once the outage is resolved.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  diagnose:
    name: Inspect deployment config + probe /api/hello
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_NAME: holocard-hunter
    steps:
      - name: Resolve Vercel project id by name
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          body=$(curl -sS --fail --oauth2-bearer "$VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_NAME}?teamId=${VERCEL_ORG_ID}")
          id=$(echo "$body" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).id')
          echo "PROJECT_ID=$id" >> "$GITHUB_ENV"
          echo "resolved project id: $id"

      - name: Wait for the deployment of this commit to go READY and dump its config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 24); do
            curl -sS --fail --oauth2-bearer "$VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&limit=25&teamId=${VERCEL_ORG_ID}" \
              -o /tmp/deployments.json
            HEAD_SHA="$HEAD_SHA" node -e '
              const fs = require("fs");
              const d = JSON.parse(fs.readFileSync("/tmp/deployments.json","utf8"));
              const list = d.deployments || [];
              const sel = list.find(x => x.meta && x.meta.githubCommitSha === process.env.HEAD_SHA);
              if (!sel) process.exit(1);
              fs.writeFileSync("/tmp/sel_uid.txt", sel.uid);
            ' && found=1 && break
            sleep 10
          done
          if [ "$found" = "0" ]; then echo "::error::no deployment found for HEAD $HEAD_SHA"; exit 1; fi
          echo "DEPLOYMENT_UID=$(cat /tmp/sel_uid.txt)" >> "$GITHUB_ENV"

          uid=$(cat /tmp/sel_uid.txt)
          for i in $(seq 1 24); do
            state=$(curl -sS --fail --oauth2-bearer "$VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/${uid}?teamId=${VERCEL_ORG_ID}" \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).status || "unknown"')
            echo "deployment status: $state"
            [ "$state" = "READY" ] && break
            sleep 10
          done

          curl -sS --fail --oauth2-bearer "$VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${uid}?teamId=${VERCEL_ORG_ID}" -o /tmp/deployment.json
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("/tmp/deployment.json","utf8"));
            console.log("== deployment ==");
            console.log("uid:", d.uid);
            console.log("url:", d.url);
            console.log("status:", d.status, "| readyState:", d.readyState, "| target:", d.target, "| created:", d.created);
            console.log("git commit:", JSON.stringify(d.gitSource && d.gitSource.ref) || "(none)");
            const cfg = d.config || {};
            console.log("== effective config ==");
            console.log("functionType:", cfg.functionType);
            console.log("functionTimeout:", cfg.functionTimeout);
            console.log("functionMemoryType:", cfg.functionMemoryType);
            console.log("functionDefaultMemoryType:", cfg.functionDefaultMemoryType);
            console.log("isUsingActiveCPU:", cfg.isUsingActiveCPU);
            console.log("regions:", JSON.stringify(cfg.regions));
            console.log("nodeVersion:", cfg.nodeVersion);
            console.log("runtime:", JSON.stringify(cfg.runtime));
            console.log("type:", cfg.type);
            console.log("maxDuration:", cfg.maxDuration);
            console.log("lambdaRuntimeStats:", JSON.stringify(cfg.lambdaRuntimeStats));
            console.log("functions:", JSON.stringify(cfg.functions));
            console.log("builds:", JSON.stringify((cfg.builds || []).map(b => ({ src: b.src, use: b.use }))));
          '
          echo "DEPLOYMENT_URL=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/deployment.json","utf8")).url')" >> "$GITHUB_ENV"

      - name: Probe static root, /api/hello, and a 404 route
        run: |
          set +e
          url="https://$DEPLOYMENT_URL"
          echo "== static / =="
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" -m 20 "$url/" || echo "static rc=$?"
          echo "== /api/hello (max 75s) =="
          curl -sS -m 75 -w "\nHTTP %{http_code} in %{time_total}s\n" "$url/api/hello" || echo "hello rc=$?"
          echo "== /api/nonexistent-xyz (max 20s) =="
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" -m 20 "$url/api/nonexistent-xyz" || echo "404 rc=$?"

      - name: Fetch Vercel runtime logs (try several endpoints, best effort)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set +e
          uid="$DEPLOYMENT_UID"
          for ep in \
            "v1/deployments/${uid}/runtime-logs?direction=backward&limit=100" \
            "v2/deployments/${uid}/events?direction=backward&limit=100" \
            "v3/deployments/${uid}/events?direction=backward&limit=100" \
            "v2/deployments/${uid}/runtime-logs?direction=backward&limit=100" ; do
            echo "== GET $ep =="
            code=$(curl -sS --oauth2-bearer "$VERCEL_TOKEN" \
              "https://api.vercel.com/${ep}&projectId=${PROJECT_ID}&teamId=${VERCEL_ORG_ID}" \
              -o /tmp/logs.json -w "%{http_code}")
            echo "HTTP $code"
            node -e '
              const fs = require("fs");
              let d; try { d = JSON.parse(fs.readFileSync("/tmp/logs.json","utf8")); } catch(e) { console.log("unparseable"); process.exit(0); }
              if (d.error) { console.log("api error:", JSON.stringify(d.error)); process.exit(0); }
              const items = d.lines || d.events || [];
              console.log("items:", items.length);
              for (const it of items.slice(0, 40)) {
                if (it.type === "command" || it.type === "stderr") continue;
                const msg = (it.payload && (it.payload.msg || it.payload.message)) || it.text || it.body || JSON.stringify(it);
                console.log((it.type||"log"), (it.created||it.timestamp||""), JSON.stringify(msg).slice(0, 300));
              }
            '
            [ -f /tmp/logs.json ] && node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/logs.json","utf8")); process.exit(d.error?1:0)' 2>/dev/null && break
          done
          true
