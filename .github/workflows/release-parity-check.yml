name: Release Parity Check (Web Production vs Mobile Production)

# DIC-1401 release parity evidence contract.
#
# Answers one question with real evidence, never an assumption: "is the
# commit currently live on Web Production (holohunter.dicoge.com) the SAME
# commit that mobile Production (the AAB/APK submitted to Play/App Store)
# was built from?"
#
# This is manual/on-demand (workflow_dispatch only) because:
#   - it needs a real, already-deployed Web Production URL to query
#     (nothing to check on a PR that hasn't shipped),
#   - it needs the mobile build's source SHA as an input, which only exists
#     once an EAS production build has actually run (see eas-build.yml /
#     scripts/ci, which records `build-provenance.json` with an immutable
#     `commit` — the 40-char source SHA — plus a `gitCommitHash` alias).
#
# The job FAILS (non-zero exit) unless the two SHAs are proven byte-identical.
# An unresolved SHA on either side is reported as `unknown`, not treated as a
# pass — this workflow must never claim parity it cannot prove.
#
# Web SHA source: `https://<web_url>/version.json`, a build-time STATIC file
# (scripts/ci/write-build-version.mjs writes dist/version.json during the
# build). It is deliberately NOT an api/* route: counting a 13th serverless
# function pushed both Vercel Hobby deployments over the per-deployment cap
# (see scripts/ci/vercel-function-count-guard.mjs).

on:
  workflow_dispatch:
    inputs:
      mobile_source_sha:
        description: "Mobile production build's source commit SHA (from build-provenance.json .commit / .gitCommitHash)"
        type: string
        required: true
      web_url:
        description: "Web Production URL to query /version.json on"
        type: string
        required: false
        default: "https://holohunter.dicoge.com"

jobs:
  release-parity-check:
    name: Compare Web Production SHA vs mobile Production source SHA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Evaluate SHA parity
        env:
          RELEASE_PARITY_WEB_URL: ${{ inputs.web_url }}
          RELEASE_PARITY_MOBILE_SHA: ${{ inputs.mobile_source_sha }}
        run: npm run release-parity-check
