      - name: Report existing auth runtime env (names/targets only, no values)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |
          set -euo pipefail
          curl -sS --oauth2-bearer "${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
          | node -e '
              const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
              const wanted = ["AUTH_SESSION_SECRET","KV_REST_API_URL","KV_REST_API_TOKEN"];
              for (const key of wanted) {
                const matches = (d.envs||[]).filter(e => e.key === key);
                if (matches.length === 0) {
                  console.log(`MISSING: ${key}`);
                } else {
                  for (const m of matches) {
                    console.log(`present: ${key} (target=${(m.target||[]).join(",")})`);
                  }
                }
              }
            '

      - name: Attach holohunter.dicoge.com domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/domain_resp.json -w '%{http_code}' -X POST \
            --oauth2-bearer "${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw '{"name":"holohunter.dicoge.com"}' \
            "https://api.vercel.com/v10/projects/${PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}")
          echo "Add-domain HTTP status: $code"
          cat /tmp/domain_resp.json
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "::error::Failed to attach domain (status $code)"
            exit 1
          fi

      - name: Trigger production redeploy
        if: ${{ inputs.redeploy }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |
          set -euo pipefail
          # Both the static VERCEL_DEPLOY_HOOK secret (404, stale) and the
          # dynamic /v1/integrations/deploy hook-creation endpoint (404, not
          # the right path) turned out not to work. Redeploy via the
          # documented Vercel REST API instead: look up the latest
          # production deployment, then POST /v13/deployments with that
          # deploymentId + forceNew=1 to force a fresh build — required so
          # the just-set EXPO_PUBLIC_* build-time env vars are actually
          # baked into the new client bundle.
          latest=$(curl -sS --oauth2-bearer "${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&target=production&limit=1&teamId=${VERCEL_ORG_ID}")
          uid=$(echo "$latest" | node -pe '
            const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
            (d.deployments && d.deployments[0] && d.deployments[0].uid) || ""
          ')
          name=$(echo "$latest" | node -pe '
            const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
            (d.deployments && d.deployments[0] && d.deployments[0].name) || ""
          ')
          if [ -z "$uid" ]; then
            echo "::error::Could not find a latest production deployment to redeploy from."
            exit 1
          fi
          echo "Redeploying from deployment: $uid"
          code=$(curl -sS -o /tmp/redeploy_resp.json -w '%{http_code}' -X POST \
            --oauth2-bearer "${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw "$(node -e '
              console.log(JSON.stringify({ name: process.argv[1], deploymentId: process.argv[2], target: "production" }));
            ' "$name" "$uid")" \
            "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_ORG_ID}")
          echo "Redeploy HTTP status: $code"
          cat /tmp/redeploy_resp.json
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Failed to trigger redeploy (status $code)"
            exit 1
          fi
          url=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/redeploy_resp.json","utf8")).url || ""')
          echo "New deployment URL: $url"

      - name: Wait for deployment to go live
        if: ${{ inputs.redeploy }}
        run: sleep 120

      - name: Verify public HTTP endpoints
        run: |
          set -uo pipefail
          for path in "/" "/privacy" "/support" "/account-deletion"; do
            url="https://holohunter.dicoge.com${path}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$url" || echo "curl_failed")
            echo "$url -> $code"
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L "https://holocard-hunter.vercel.app/" || echo "curl_failed")
          echo "https://holocard-hunter.vercel.app/ -> $code"
