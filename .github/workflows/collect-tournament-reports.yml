name: Collect Tournament Reports

# DIC-1380 W6: the scheduled refresh path MUST acquire genuinely fresh
# upstream tournament data — running the offline collector over already-
# committed source files is not a refresh. The monthly scheduled fire
# now runs the collector in `--live` mode (DIC-1024): the collector
# fetches the public Deck Log view API for opt-in source files (one
# request per deck, sequential, ≥500ms spacing, bounded retries) and
# writes back the fetched-and-validated cards to the committed source
# files, then produces the per-month normalized reports. A manual
# `workflow_dispatch` still exposes `dry_run` and `skip_live` for
# maintainers who want a preview or a fallback offline run.
#
# The monthly cron fires on the last day of every month at 20:00 UTC
# (= 05:00 JST on the 1st of the next month, when the OpenSpace tournament
# summaries normally land).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not write files)'
        type: boolean
        default: true
      skip_live:
        description: 'Skip the --live upstream fetch (offline only)'
        type: boolean
        default: false
  schedule:
    # Last day of each month, 20:00 UTC (= 05:00 JST on the 1st of the next
    # month). The scheduled run is LIVE — it fetches fresh source data
    # from the tournament site. A false-positive day (e.g. 20:00 UTC on
    # Feb 28 in a non-leap year) is a no-op — the collector emits nothing
    # new and the PR step short-circuits on an empty diff.
    - cron: '0 20 28-31 * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # DIC-1380 W6: scheduled dispatches ALWAYS run the LIVE collector +
      # PR the deltas. A manual workflow_dispatch with dry_run=true takes
      # the read-only path; skip_live=true drops back to the offline
      # collector for maintainers who want a rebuild without live fetch.
      # A schedule fire has `inputs.dry_run`/`inputs.skip_live` unset
      # (== ''), so both `!= 'true'` guards route it to the live wet
      # branch.
      - name: Collect tournament reports
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run collect:tournaments -- --dry-run
          elif [ "${{ inputs.skip_live }}" = "true" ]; then
            npm run collect:tournaments
          else
            npm run collect:tournaments -- --live
          fi

      - name: Check data changes
        id: check
        if: inputs.dry_run != 'true'
        run: |
          if git diff --stat -- 'data/tournaments/' 'public/data/tournaments/' | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: inputs.dry_run != 'true' && steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/tournaments/ public/data/tournaments/
          git diff --staged --quiet || git commit -m "chore: update tournament reports $(date +%Y-%m-%d)"
          git push origin main
