name: Collect Tournament Reports

# DIC-1380 W5: real, wired, scheduled refresh path for tournament decks. The
# runtime + audit paths expect fresh tournament data; the previous
# manual-only comment kept this workflow permanently off, so the "scheduled
# refresh" contract the release train commits to was aspirational.
#
# The scheduled run stays STRICTLY OFFLINE — it invokes the collector
# against committed, human-verified source files under
# `data/tournaments/sources/` (which the local pipeline pushes into
# main separately) and NEVER fetches the live tournament site from CI. This
# means the DIC-979 #8 concerns (official-column DOM contract + ToS/robots
# posture) do not apply to the CI leg: no live HTML is touched here. A
# manual dispatch still exposes a `dry_run` input for maintainers who want a
# preview without a commit.
#
# The monthly cron fires on the last day of every month at 20:00 UTC (= 05:00
# JST on the 1st of the next month, when the OpenSpace tournament summaries
# normally land). The job runs the offline collector, PRs any deltas.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not write files)'
        type: boolean
        default: true
  schedule:
    # Last day of each month, 20:00 UTC (= 05:00 JST on the 1st of the next
    # month). The offline collector runs against committed source files, so
    # a false-positive day (e.g. 20:00 UTC on Feb 28 in a non-leap year) is
    # a no-op — the collector emits nothing new and the PR step short-
    # circuits on an empty diff.
    - cron: '0 20 28-31 * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # DIC-1380 W5: scheduled dispatches ALWAYS run the wet collector +
      # PR the deltas. Only a manual workflow_dispatch with dry_run=true
      # takes the read-only path; that is the only case where the input is
      # explicitly set to `true`. A schedule fire has `inputs.dry_run`
      # unset (== ''), so the `!= 'true'` guard below routes it to the wet
      # branch.
      - name: Collect tournament reports (offline, from committed sources)
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run collect:tournaments -- --dry-run
          else
            npm run collect:tournaments
          fi

      - name: Check data changes
        id: check
        if: inputs.dry_run != 'true'
        run: |
          if git diff --stat -- 'data/tournaments/' 'public/data/tournaments/' | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: inputs.dry_run != 'true' && steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/tournaments/ public/data/tournaments/
          git diff --staged --quiet || git commit -m "chore: update tournament reports $(date +%Y-%m-%d)"
          git push origin main
