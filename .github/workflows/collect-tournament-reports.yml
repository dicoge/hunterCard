name: Collect Tournament Reports

# ⚠️ PRODUCTION MONTHLY SCHEDULE IS INTENTIONALLY NOT ENABLED (DIC-979 #8).
#
# The monthly day-1 cron must NOT be turned on until (a) the official-column DOM
# contract is verified against live HTML and (b) its ToS/robots posture is
# confirmed. Until then this workflow is MANUAL-ONLY (workflow_dispatch) and runs
# the collector OFFLINE from committed, human-verified source files under
# data/tournaments/sources/ — it never fetches the live site.
#
# Proposed schedule for Mac-OpenCode to enable AFTER CR/QA passes (05:00 JST on
# the 1st of each month = 20:00 UTC on the last day of the prior month):
#
#   on:
#     schedule:
#       - cron: '0 20 28-31 * *'   # gate to day-1 JST inside the job
#
# Proposed local/cron command (equivalent, offline collector):
#   cd hunterCard && npm run collect:tournaments
#
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not write files)'
        type: boolean
        default: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect tournament reports (offline, from committed sources)
        run: |
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            npm run collect:tournaments
          else
            npm run collect:tournaments -- --dry-run
          fi

      - name: Check data changes
        id: check
        if: inputs.dry_run == false
        run: |
          if git diff --stat -- 'data/tournaments/' 'public/data/tournaments/' | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: inputs.dry_run == false && steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/tournaments/ public/data/tournaments/
          git diff --staged --quiet || git commit -m "chore: update tournament reports $(date +%Y-%m-%d)"
          git push origin main
