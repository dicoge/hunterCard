name: Official Catalog Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'

jobs:
  official-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync official catalog
        run: node scripts/scrape-official-cards.js --check-production=https://holohunter.dicoge.com/data/database.json

      - name: Merge official catalog into database
        run: node scripts/sync-official-catalog-to-database.mjs

      - name: Re-apply exact-version buy price alignment
        run: node scripts/regen-buy-alignment.mjs

      - name: Generate native database asset
        run: node scripts/generate-native-database.mjs

      - name: Validate hEB01 ingestion
        run: node scripts/test-official-catalog-sync.mjs

      - name: Check data changes
        id: check
        run: |
          if git diff --stat -- data/official/ data/database.json public/data/database.json docs/audits/official-catalog-audit.json docs/audits/official-production-lag-state.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push catalog changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/official/ data/database.json public/data/database.json docs/audits/official-catalog-audit.json docs/audits/official-production-lag-state.json
          git diff --staged --quiet || git commit -m "chore: sync official catalog $(date +%Y-%m-%d)"
          git push origin HEAD:main
