name: Scrape & Build Database

on:
  workflow_dispatch:  # Only manual trigger — CI IP blocked by yuyu-tei WAF; local cron handles daily scrape

jobs:
  build-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # Test-first flow: price data lands on staging (where every push runs CI)
      # and reaches main only through a promotion PR that passes the
      # stage-promotion proof. This workflow no longer touches main.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Security floor (Render eMudhra advisory, Node 22.23.4 NSS root update):
          # semver range = >=22.23.4 <23, so a stale cached 22.x is never used.
          node-version: '22.23.4 - 22'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run database builder
        working-directory: scripts
        id: build
        run: node build-database.js
        continue-on-error: true

      - name: Show scrape log if failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== SCRAPE LOG ==="
          if [ -f data/scrape-log.txt ]; then
            cat data/scrape-log.txt
          else
            echo "(no scrape log found)"
          fi
          echo "=== END SCRAPE LOG ==="
          exit 1  # Reject the step

      - name: Validate database
        run: |
          CARD_COUNT=$(python3 -c "import json; d=json.load(open('data/database.json')); print(d.get('totalCards',0))" 2>/dev/null || echo "0")
          echo "Database has $CARD_COUNT cards"
          if [ "$CARD_COUNT" -lt 50 ]; then
            echo "❌ SAFETY CHECK FAILED: totalCards=$CARD_COUNT < 50"
            exit 1
          fi
          echo "✅ Validation passed"

      - name: Generate native database asset
        run: node scripts/generate-native-database.mjs

      - name: Check data changes
        id: check
        run: |
          if git diff --stat -- 'data/database.json' 'data/images/' 'public/data/database.json' | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data has changed"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes"
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/database.json data/images/ public/data/database.json
          git diff --staged --quiet || git commit -m "chore: update database $(date +%Y-%m-%d)"
          git push origin HEAD:refs/heads/staging

      # No deploy hook: the formal website is deployed only from main after a
      # promotion. The staging project picks this commit up through its own Git
      # integration once its Production Branch is set to `staging`.