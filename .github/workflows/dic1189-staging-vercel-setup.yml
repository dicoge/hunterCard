name: DIC-1189 Staging Vercel + DNS Setup

# One-time, auditable, manual-dispatch tool that stands up the isolated
# staging deployment for HoloHunter. Third rework pass (post-DIC-1191/1194
# re-review). Every step is idempotent (read-first / mutate-only-when-
# needed); every write is rollback-safe (PATCH-in-place, no delete-then-
# create); every run is serialized (concurrency queues instead of cancels).
#
# Highlights of THIS pass:
#
#   - Independent staging KV is REQUIRED via operator-applied
#     STAGING_KV_REST_API_URL + STAGING_KV_REST_API_TOKEN GitHub secrets
#     (the sunset /v1/storage/stores path was removed). The workflow
#     verifies both secrets are set AND differ from the production
#     KV_REST_API_URL / KV_REST_API_TOKEN before writing them into the
#     staging project. No fallback to shared production KV
#     (rework-blocker #1).
#
#   - Server-side staging secrets are proven DISTINCT from production at
#     workflow time: AUTH_SESSION_SECRET_STAGING != AUTH_SESSION_SECRET
#     AND PUSH_NOTIFY_SECRET_STAGING != PUSH_NOTIFY_SECRET, both non-empty.
#     Comparison is done in-process without echoing values (rework-
#     blocker #3b).
#
#   - Env writes are PATCH-in-place upserts, not delete-then-create. On a
#     re-run the existing env entry's ID is discovered, then PATCH updates
#     value/target atomically. The prior good value is never removed
#     before its replacement is confirmed. If PATCH is unavailable
#     (Vercel returns 405) we do POST first, then DELETE the shadow
#     duplicate; a POST failure never triggers a DELETE (rework-blocker
#     #6a).
#
#   - Workflow-level concurrency SERIALIZES runs (cancel-in-progress:
#     false). A second dispatch queues after the first finishes rather
#     than cancelling it mid-write and leaving partial state (rework-
#     blocker #6b).
#
#   - The one production-project mutation — APP_ENV=production on
#     holocard-hunter — targets ["production"] only, not preview. Preview
#     deployments (feature branches, PRs) are not forced to production
#     behaviour; only the actual production deploy is (rework-blocker
#     #6c).
#
#   - Everything from the previous pass that was already correct is
#     preserved: curl timeouts + retries, bounded polling, fatal smoke
#     asserts with the exact SHA from the deployment record, production
#     non-regression `if: always()`, DNS record name+type+value
#     validation.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "false = probe (read-only). true = actually create/update the staging project + DNS + deploy."
        type: boolean
        required: true
        default: false
      redeploy:
        description: "After apply, trigger a staging deployment and run the smoke test."
        type: boolean
        required: true
        default: true

concurrency:
  # Rework-blocker #6b: SERIALIZE — cancel-in-progress: false. A second
  # dispatch waits its turn instead of killing the first run mid-write and
  # leaving env / DNS / deployment state half-applied.
  group: dic1189-staging-vercel-setup
  cancel-in-progress: false

jobs:
  setup:
    name: Configure staging Vercel + DNS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAGING_PROJECT_NAME: holohunter-staging
      PRODUCTION_PROJECT_NAME: holocard-hunter
      STAGING_HOST: test.holohunter.dicoge.com
      APEX_DOMAIN: dicoge.com
      STAGING_BRANCH: staging
      GITHUB_REPO: dicoge/hunterCard
      VERCEL_CNAME_TARGET: cname.vercel-dns.com
      CURL_OPTS: "--connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 --retry-connrefused"

    steps:
      - name: Print plan and inputs
        run: |
          echo "MODE: $([ '${{ inputs.apply }}' = 'true' ] && echo APPLY || echo PROBE)"
          echo "REDEPLOY: ${{ inputs.redeploy }}"
          echo "STAGING_PROJECT_NAME: ${STAGING_PROJECT_NAME}"
          echo "PRODUCTION_PROJECT_NAME: ${PRODUCTION_PROJECT_NAME}"
          echo "STAGING_HOST: ${STAGING_HOST}"
          echo "APEX_DOMAIN: ${APEX_DOMAIN}"
          echo "STAGING_BRANCH: ${STAGING_BRANCH}"
          echo "GITHUB_REPO: ${GITHUB_REPO}"
          echo "VERCEL_CNAME_TARGET: ${VERCEL_CNAME_TARGET}"

      # ── Step 0: pre-flight — resolve the production project id ──────────
      - name: Pre-flight — resolve production project id
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          resp=$(curl -sS $CURL_OPTS -w '\n%{http_code}' \
            --oauth2-bearer "${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${PRODUCTION_PROJECT_NAME}?teamId=${VERCEL_ORG_ID}")
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          echo "GET /v9/projects/${PRODUCTION_PROJECT_NAME} → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Cannot read production project '${PRODUCTION_PROJECT_NAME}' (HTTP $code)."
            echo "$body"
            exit 1
          fi
          parsed=$(echo "$body" | node -e '
            const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
            if (typeof d.id !== "string" || typeof d.name !== "string") process.exit(2);
            console.log(JSON.stringify({ id: d.id, name: d.name }));
          ')
          prod_id=$(echo "$parsed" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).id')
          prod_name=$(echo "$parsed" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).name')
          if [ "$prod_name" != "${PRODUCTION_PROJECT_NAME}" ]; then
            echo "::error::Production project name mismatch: expected '${PRODUCTION_PROJECT_NAME}', got '${prod_name}'."
            exit 1
          fi
          echo "PROD_PROJECT_ID=$prod_id" >> "$GITHUB_ENV"
          echo "Resolved production project id: $prod_id"

      # ── Step 1: resolve or create the staging Vercel project ────────────
      - name: Resolve or create holohunter-staging project
        id: project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          resp=$(curl -sS $CURL_OPTS -w '\n%{http_code}' \
            --oauth2-bearer "${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${STAGING_PROJECT_NAME}?teamId=${VERCEL_ORG_ID}")
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          echo "GET /v9/projects/${STAGING_PROJECT_NAME} → HTTP $code"

          if [ "$code" = "200" ]; then
            parsed=$(echo "$body" | node -e '
              const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
              if (typeof d.id !== "string" || typeof d.name !== "string") process.exit(2);
              console.log(JSON.stringify({ id: d.id, name: d.name }));
            ')
            id=$(echo "$parsed" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).id')
            name=$(echo "$parsed" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).name')
            if [ "$name" != "${STAGING_PROJECT_NAME}" ]; then
              echo "::error::Staging project name mismatch."
              exit 1
            fi
            echo "Existing project id: $id"
            echo "PROJECT_ID=$id" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$code" != "404" ]; then
            echo "::error::Unexpected HTTP $code reading staging Vercel project."
            echo "$body"
            exit 1
          fi

          if [ "${{ inputs.apply }}" != "true" ]; then
            echo "::warning::PROBE mode: project not found. Would POST /v11/projects."
            echo "PROJECT_ID=" >> "$GITHUB_ENV"
            exit 0
          fi

          create_body=$(node -e '
            console.log(JSON.stringify({
              name: process.argv[1],
              framework: null,
              gitRepository: { type: "github", repo: process.argv[2], productionBranch: process.argv[3] },
              buildCommand: null, outputDirectory: null, installCommand: null, devCommand: null,
            }));
          ' "$STAGING_PROJECT_NAME" "$GITHUB_REPO" "$STAGING_BRANCH")

          create_resp=$(curl -sS $CURL_OPTS -w '\n%{http_code}' -X POST \
            --oauth2-bearer "${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw "$create_body" \
            "https://api.vercel.com/v11/projects?teamId=${VERCEL_ORG_ID}")
          create_code=$(echo "$create_resp" | tail -n1)
          create_json=$(echo "$create_resp" | sed '$d')
          echo "POST /v11/projects → HTTP $create_code"
          if [ "$create_code" != "200" ] && [ "$create_code" != "201" ]; then
            echo "::error::Failed to create staging project (HTTP $create_code)."
            echo "$create_json"
            exit 1
          fi
          parsed=$(echo "$create_json" | node -e '
            const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
            if (typeof d.id !== "string" || typeof d.name !== "string") process.exit(2);
            console.log(JSON.stringify({ id: d.id, name: d.name }));
          ')
          id=$(echo "$parsed" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).id')
          echo "Created project id: $id"
          echo "PROJECT_ID=$id" >> "$GITHUB_ENV"

      # ── Step 2: verify STAGING_KV_* is applied AND provably distinct ────
      # Rework 4th pass — blocker #1: the previous "distinctness" check
      # compared the staging URL against a Vercel-API-read value that was
      # empty for encrypted-only entries, letting any nonempty staging URL
      # trivially pass. It also compared the staging token only against a
      # GitHub secret whose contents we could not prove match holocard-
      # hunter's deployed value. Both were inference-from-empty holes.
      #
      # This step now uses an AUTHORITATIVE proof: after byte-comparing the
      # operator-supplied secrets (all four required, all four must differ
      # in the same lane), it PINGs both REST endpoints with their supplied
      # tokens to prove they authenticate against SEPARATE Upstash / Vercel
      # KV instances via a canary write-and-cross-read:
      #   1. Write a random nonce K→A to staging KV via its URL+token.
      #   2. Attempt to read K from production KV via ITS URL+token.
      #   3. Read MUST be null. If it returns A, the two point at the same
      #      instance — HARD FAIL. Repeat the other direction with a
      #      different nonce.
      # This is a real cross-instance isolation proof; a shared instance
      # cannot satisfy it. The canary keys are prefixed with
      # `dic1189:canary:` and TTL 30s so they expire on their own; each
      # canary is DELETE'd explicitly at the end regardless. Secret values
      # never leave the runner (never echoed; only Bearer'd into curl).
      - name: Verify independent staging KV (operator-applied proof + canary isolation)
        if: env.PROJECT_ID != '' && inputs.apply == true
        env:
          STAGING_KV_REST_API_URL: ${{ secrets.STAGING_KV_REST_API_URL }}
          STAGING_KV_REST_API_TOKEN: ${{ secrets.STAGING_KV_REST_API_TOKEN }}
          PROD_KV_REST_API_URL_REF: ${{ secrets.KV_REST_API_URL }}
          PROD_KV_REST_API_TOKEN_REF: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          set -euo pipefail
          # (a) All four secrets must be non-empty. Empty prod references
          #     are a HARD FAIL — we never infer isolation from missing data.
          if [ -z "${STAGING_KV_REST_API_URL:-}" ] || [ -z "${STAGING_KV_REST_API_TOKEN:-}" ]; then
            echo "::error::HARD FAIL: STAGING_KV_REST_API_URL / STAGING_KV_REST_API_TOKEN GitHub secrets are missing. Provision an independent Upstash Redis / Vercel KV via the Marketplace UI and register its REST url+token as GitHub secrets."
            exit 1
          fi
          if [ -z "${PROD_KV_REST_API_URL_REF:-}" ] || [ -z "${PROD_KV_REST_API_TOKEN_REF:-}" ]; then
            echo "::error::HARD FAIL: production reference GitHub secrets KV_REST_API_URL / KV_REST_API_TOKEN are required for the distinctness proof. Register both before re-running. This workflow will NEVER infer separation from an empty/hidden reference."
            exit 1
          fi

          # (b) Mask both secret values so no downstream step can leak them.
          echo "::add-mask::${STAGING_KV_REST_API_TOKEN}"
          echo "::add-mask::${PROD_KV_REST_API_TOKEN_REF}"

          # (c) Byte-distinctness comparison, in-process, no values echoed.
          node -e '
            const stgUrl = process.env.STAGING_KV_REST_API_URL || "";
            const stgTok = process.env.STAGING_KV_REST_API_TOKEN || "";
            const prdUrl = process.env.PROD_KV_REST_API_URL_REF || "";
            const prdTok = process.env.PROD_KV_REST_API_TOKEN_REF || "";
            if (stgUrl === prdUrl) { console.error("::error::HARD FAIL: STAGING_KV_REST_API_URL equals production reference URL."); process.exit(1); }
            if (stgTok === prdTok) { console.error("::error::HARD FAIL: STAGING_KV_REST_API_TOKEN equals production reference token."); process.exit(1); }
            console.log("byte-distinctness OK (URL + token both differ)");
          '

          # (d) Canary cross-read: PROVE the two instances are separate.
          # Upstash Redis REST accepts `POST { command: [...] }` at `/`.
          # A leak here would mean the same instance backs both, in which
          # case a canary written via one URL+token pair is visible via
          # the other URL+token pair.
          canary_stg="dic1189:canary:stg:$(node -e 'console.log(require("crypto").randomBytes(12).toString("hex"))')"
          canary_prd="dic1189:canary:prd:$(node -e 'console.log(require("crypto").randomBytes(12).toString("hex"))')"
          value_stg=$(node -e 'console.log(require("crypto").randomBytes(16).toString("hex"))')
          value_prd=$(node -e 'console.log(require("crypto").randomBytes(16).toString("hex"))')

          kv_cmd() {
            # $1 = url, $2 = bearer, $3 = command JSON. Returns response body.
            curl -sS $CURL_OPTS -H "Authorization: Bearer $2" \
              -H "Content-Type: application/json" \
              --data-raw "$3" "$1" || echo '{"error":"curl_failed"}'
          }

          # Write staging canary with TTL, then attempt to read it via prod.
          set_stg=$(kv_cmd "${STAGING_KV_REST_API_URL}" "${STAGING_KV_REST_API_TOKEN}" \
            "$(node -e 'console.log(JSON.stringify(["SET",process.argv[1],process.argv[2],"EX","30"]))' "$canary_stg" "$value_stg")")
          set_prd=$(kv_cmd "${PROD_KV_REST_API_URL_REF}" "${PROD_KV_REST_API_TOKEN_REF}" \
            "$(node -e 'console.log(JSON.stringify(["SET",process.argv[1],process.argv[2],"EX","30"]))' "$canary_prd" "$value_prd")")
          # Cross-reads: staging canary MUST NOT be visible via prod, and
          # vice versa. A nil / null / non-string result is what we require.
          read_via_prd=$(kv_cmd "${PROD_KV_REST_API_URL_REF}" "${PROD_KV_REST_API_TOKEN_REF}" \
            "$(node -e 'console.log(JSON.stringify(["GET",process.argv[1]]))' "$canary_stg")")
          read_via_stg=$(kv_cmd "${STAGING_KV_REST_API_URL}" "${STAGING_KV_REST_API_TOKEN}" \
            "$(node -e 'console.log(JSON.stringify(["GET",process.argv[1]]))' "$canary_prd")")

          # Sanity: our own writes must be visible to ourselves (otherwise
          # the operator's URL/token don't work at all, which would ALSO
          # hard-fail — we cannot certify an unreachable instance).
          self_stg=$(kv_cmd "${STAGING_KV_REST_API_URL}" "${STAGING_KV_REST_API_TOKEN}" \
            "$(node -e 'console.log(JSON.stringify(["GET",process.argv[1]]))' "$canary_stg")")
          self_prd=$(kv_cmd "${PROD_KV_REST_API_URL_REF}" "${PROD_KV_REST_API_TOKEN_REF}" \
            "$(node -e 'console.log(JSON.stringify(["GET",process.argv[1]]))' "$canary_prd")")

          # Best-effort cleanup regardless of outcome.
          kv_cmd "${STAGING_KV_REST_API_URL}" "${STAGING_KV_REST_API_TOKEN}" \
            "$(node -e 'console.log(JSON.stringify(["DEL",process.argv[1]]))' "$canary_stg")" > /dev/null || true
          kv_cmd "${PROD_KV_REST_API_URL_REF}" "${PROD_KV_REST_API_TOKEN_REF}" \
            "$(node -e 'console.log(JSON.stringify(["DEL",process.argv[1]]))' "$canary_prd")" > /dev/null || true

          # Parse + assert. Values passed as CLI args to isolate them from
          # the process.env dump; never echoed by node.
          node -e '
            const args = process.argv.slice(1);
            const [stgExp, prdExp, stgSelfRaw, prdSelfRaw, stgViaPrdRaw, prdViaStgRaw] = args;
            const parse = (raw) => { try { return JSON.parse(raw).result; } catch { return raw; } };
            const stgSelf = parse(stgSelfRaw);
            const prdSelf = parse(prdSelfRaw);
            const stgViaPrd = parse(stgViaPrdRaw);
            const prdViaStg = parse(prdViaStgRaw);
            let ok = true;
            if (stgSelf !== stgExp) { console.error("::error::HARD FAIL: staging KV self-read did not return the just-written canary. The staging URL/token pair does not authenticate against a writable instance — cannot certify."); ok = false; }
            if (prdSelf !== prdExp) { console.error("::error::HARD FAIL: production KV self-read did not return the just-written canary. The production reference URL/token pair does not authenticate — cannot certify."); ok = false; }
            if (stgViaPrd !== null && stgViaPrd !== undefined && stgViaPrd !== "") { console.error("::error::HARD FAIL: production KV read the staging canary — they are the SAME instance. Isolation FAILED."); ok = false; }
            if (prdViaStg !== null && prdViaStg !== undefined && prdViaStg !== "") { console.error("::error::HARD FAIL: staging KV read the production canary — they are the SAME instance. Isolation FAILED."); ok = false; }
            if (!ok) process.exit(1);
            console.log("canary isolation proof OK — staging and production KV are provably separate instances.");
          ' "$value_stg" "$value_prd" "$self_stg" "$self_prd" "$read_via_prd" "$read_via_stg"

          # Mark the staging URL/token available to the env-set step below.
          echo "KV_REST_API_URL=${STAGING_KV_REST_API_URL}" >> "$GITHUB_ENV"
          echo "KV_REST_API_TOKEN=${STAGING_KV_REST_API_TOKEN}" >> "$GITHUB_ENV"

      # ── Step 3: link staging project to GitHub repo ─────────────────────
      - name: Ensure GitHub repo linked with productionBranch=staging
        if: env.PROJECT_ID != '' && inputs.apply == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          proj_resp=$(curl -sS $CURL_OPTS -w '\n%{http_code}' \
            --oauth2-bearer "${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          proj_code=$(echo "$proj_resp" | tail -n1)
          proj_body=$(echo "$proj_resp" | sed '$d')
          if [ "$proj_code" != "200" ]; then
            echo "::error::Cannot read staging project state (HTTP $proj_code)."
            exit 1
          fi
          current=$(echo "$proj_body" | node -e '
            const p = JSON.parse(require("fs").readFileSync(0,"utf8"));
            const link = p.link || {};
            console.log(JSON.stringify({ type: link.type||"", repo: link.repo||"", productionBranch: link.productionBranch||"" }));
          ')
          echo "Current link: $current"
          need_link="true"
          if echo "$current" | grep -q '"type":"github"' && \
             echo "$current" | grep -q "\"repo\":\"${GITHUB_REPO}\"" && \
             echo "$current" | grep -q "\"productionBranch\":\"${STAGING_BRANCH}\""; then
            need_link="false"
          fi
          if [ "$need_link" = "false" ]; then
            echo "Repo link + branch already correct — no write needed."
            exit 0
          fi
          patch_body=$(node -e '
            console.log(JSON.stringify({
              gitRepository: { type: "github", repo: process.argv[1], productionBranch: process.argv[2] },
            }));
          ' "$GITHUB_REPO" "$STAGING_BRANCH")
          patch_resp=$(curl -sS $CURL_OPTS -w '\n%{http_code}' -X PATCH \
            --oauth2-bearer "${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw "$patch_body" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          patch_code=$(echo "$patch_resp" | tail -n1)
          echo "PATCH /v9/projects/${PROJECT_ID} → HTTP $patch_code"
          if [ "$patch_code" != "200" ] && [ "$patch_code" != "201" ]; then
            echo "::error::Failed to link staging project (HTTP $patch_code)."
            echo "$patch_resp" | sed '$d'
            exit 1
          fi

      # ── Step 4: server staging secrets applied AND distinct from prod ──
      # Rework-blocker #3b: prove staging secrets are DIFFERENT from
      # production, not just distinct variable names. Compared in-process
      # via node without echoing values.
      - name: Verify staging server secrets are distinct from production
        if: env.PROJECT_ID != '' && inputs.apply == true
        env:
          AUTH_SESSION_SECRET_STAGING: ${{ secrets.AUTH_SESSION_SECRET_STAGING }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          PUSH_NOTIFY_SECRET_STAGING: ${{ secrets.PUSH_NOTIFY_SECRET_STAGING }}
          PUSH_NOTIFY_SECRET: ${{ secrets.PUSH_NOTIFY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${AUTH_SESSION_SECRET_STAGING:-}" ]; then
            echo "::error::HARD FAIL: repo secret AUTH_SESSION_SECRET_STAGING is missing."
            exit 1
          fi
          if [ -z "${PUSH_NOTIFY_SECRET_STAGING:-}" ]; then
            echo "::error::HARD FAIL: repo secret PUSH_NOTIFY_SECRET_STAGING is missing."
            exit 1
          fi
          if [ -z "${AUTH_SESSION_SECRET:-}" ] || [ -z "${PUSH_NOTIFY_SECRET:-}" ]; then
            echo "::error::HARD FAIL: production reference secrets AUTH_SESSION_SECRET / PUSH_NOTIFY_SECRET must be present for the distinctness check. Register them before re-running."
            exit 1
          fi
          node -e '
            const pairs = [
              ["AUTH_SESSION_SECRET_STAGING", "AUTH_SESSION_SECRET"],
              ["PUSH_NOTIFY_SECRET_STAGING", "PUSH_NOTIFY_SECRET"],
            ];
            for (const [stgKey, prdKey] of pairs) {
              const stg = process.env[stgKey] || "";
              const prd = process.env[prdKey] || "";
              if (stg === prd) {
                console.error(`::error::HARD FAIL: ${stgKey} equals ${prdKey} — staging must use a distinct secret from production.`);
                process.exit(1);
              }
            }
            console.log("Staging server secrets are distinct from production.");
          '

      # ── Step 5: set staging project env (PATCH-in-place upserts) ────────
      - name: Set staging project env (atomic upserts)
        if: env.PROJECT_ID != '' && inputs.apply == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          AUTH_SESSION_SECRET_STAGING: ${{ secrets.AUTH_SESSION_SECRET_STAGING }}
          PUSH_NOTIFY_SECRET_STAGING: ${{ secrets.PUSH_NOTIFY_SECRET_STAGING }}
          EXPO_STAGING_TEST_TOKENS: ${{ secrets.EXPO_STAGING_TEST_TOKENS }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          # Rework 4th pass — blocker #2: env writes are BOTH scope-aware AND
          # rollback-safe:
          #   - reconcile_env <project> <key> <value|""> <type> <targets_json>
          #   - matches existing entries by (key AND target set AND
          #     gitBranch=null) — never touches an unrelated scoped entry
          #     (e.g. a preview-scoped APP_ENV when we mean production).
          #   - empty value ⇒ DELETE the matching entry(ies) rather than
          #     "skip" — clears a stale allowlist (e.g. EXPO_STAGING_TEST_
          #     TOKENS) instead of leaving it in place.
          #   - nonempty value ⇒ PATCH-in-place if a matching entry exists,
          #     POST otherwise; prior good value never deleted before its
          #     replacement is confirmed (blocker #6a preserved).
          reconcile_env() {
            proj="$1"; key="$2"; value="$3"; type="${4:-encrypted}"; targets_json="${5:-[\"production\",\"preview\"]}"
            listing=$(curl -sS $CURL_OPTS --oauth2-bearer "${VERCEL_TOKEN}" \
              "https://api.vercel.com/v9/projects/${proj}/env?teamId=${VERCEL_ORG_ID}")
            # Find matching entries: key + exact target-set + no gitBranch.
            matching_ids=$(echo "$listing" | node -pe '
              const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
              const wantKey = process.argv[1];
              const wantTargets = JSON.stringify(JSON.parse(process.argv[2]).sort());
              (d.envs||[]).filter(e =>
                e.key === wantKey &&
                JSON.stringify((e.target||[]).slice().sort()) === wantTargets &&
                (e.gitBranch == null || e.gitBranch === "")
              ).map(e => e.id).join("\n");
            ' "$key" "$targets_json" 2>/dev/null || true)

            if [ -z "$value" ]; then
              # DELETE semantics: remove exactly the matching-scope entries.
              # Unrelated scopes preserved.
              if [ -z "$matching_ids" ]; then
                echo "reconcile env $proj/$key targets=$targets_json → already absent, no-op"
                return 0
              fi
              for id in $matching_ids; do
                [ -z "$id" ] && continue
                del_code=$(curl -sS $CURL_OPTS -o /dev/null -w '%{http_code}' -X DELETE \
                  --oauth2-bearer "${VERCEL_TOKEN}" \
                  "https://api.vercel.com/v9/projects/${proj}/env/${id}?teamId=${VERCEL_ORG_ID}")
                echo "DELETE env $proj/$key/$id (scope=$targets_json) → HTTP $del_code"
                if [ "$del_code" != "200" ] && [ "$del_code" != "204" ]; then
                  echo "::error::Failed to DELETE stale scoped env $proj/$key/$id (HTTP $del_code)."
                  exit 1
                fi
              done
              return 0
            fi

            # Nonempty value: PATCH-in-place if a matching-scope entry
            # exists, POST otherwise.
            first_id=$(echo "$matching_ids" | head -n1)
            if [ -n "$first_id" ]; then
              patch_body=$(node -e '
                const v = process.argv[1], t = process.argv[2], tg = JSON.parse(process.argv[3]);
                console.log(JSON.stringify({ value: v, type: t, target: tg }));
              ' "$value" "$type" "$targets_json")
              patch_code=$(curl -sS $CURL_OPTS -o /tmp/patch_resp.json -w '%{http_code}' -X PATCH \
                --oauth2-bearer "${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-raw "$patch_body" \
                "https://api.vercel.com/v9/projects/${proj}/env/${first_id}?teamId=${VERCEL_ORG_ID}")
              echo "PATCH env $proj/$key/$first_id (scope=$targets_json) → HTTP $patch_code"
              if [ "$patch_code" != "200" ] && [ "$patch_code" != "201" ]; then
                echo "::error::PATCH env $proj/$key/$first_id failed (HTTP $patch_code). Prior value NOT deleted."
                cat /tmp/patch_resp.json
                exit 1
              fi
              # Validate the write: refetch and confirm the matching-scope
              # entry now reports our target-set + (for plain values) our
              # value. Encrypted-type values are not returned by the API,
              # so for them we only assert the entry exists in the target
              # set.
              verify=$(curl -sS $CURL_OPTS --oauth2-bearer "${VERCEL_TOKEN}" \
                "https://api.vercel.com/v9/projects/${proj}/env?teamId=${VERCEL_ORG_ID}")
              ok=$(echo "$verify" | node -pe '
                const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
                const wantKey = process.argv[1];
                const wantTargets = JSON.stringify(JSON.parse(process.argv[2]).sort());
                const wantType = process.argv[3];
                const wantValue = process.argv[4];
                const e = (d.envs||[]).find(x =>
                  x.key === wantKey &&
                  JSON.stringify((x.target||[]).slice().sort()) === wantTargets &&
                  (x.gitBranch == null || x.gitBranch === "")
                );
                if (!e) { console.log("missing"); process.exit(0); }
                if (e.type !== wantType) { console.log("type_mismatch"); process.exit(0); }
                if (wantType === "plain" && String(e.value||"") !== wantValue) { console.log("value_mismatch"); process.exit(0); }
                console.log("ok");
              ' "$key" "$targets_json" "$type" "$value")
              if [ "$ok" != "ok" ]; then
                echo "::error::Post-write validation failed for $proj/$key (scope=$targets_json): $ok"
                exit 1
              fi
              # Clean up duplicate matching-scope entries (should not
              # normally exist; be defensive).
              for id in $matching_ids; do
                [ -z "$id" ] && continue
                [ "$id" = "$first_id" ] && continue
                del_code=$(curl -sS $CURL_OPTS -o /dev/null -w '%{http_code}' -X DELETE \
                  --oauth2-bearer "${VERCEL_TOKEN}" \
                  "https://api.vercel.com/v9/projects/${proj}/env/${id}?teamId=${VERCEL_ORG_ID}")
                echo "  cleanup duplicate $proj/$key/$id → HTTP $del_code"
              done
              return 0
            fi

            # No matching-scope entry: POST a new one.
            post_body=$(node -e '
              const k = process.argv[1], v = process.argv[2], t = process.argv[3], tg = JSON.parse(process.argv[4]);
              console.log(JSON.stringify({ key: k, value: v, type: t, target: tg }));
            ' "$key" "$value" "$type" "$targets_json")
            post_code=$(curl -sS $CURL_OPTS -o /tmp/post_resp.json -w '%{http_code}' -X POST \
              --oauth2-bearer "${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-raw "$post_body" \
              "https://api.vercel.com/v10/projects/${proj}/env?teamId=${VERCEL_ORG_ID}")
            echo "POST env $proj/$key (scope=$targets_json) → HTTP $post_code"
            if [ "$post_code" != "200" ] && [ "$post_code" != "201" ]; then
              echo "::error::POST env $proj/$key failed (HTTP $post_code)."
              cat /tmp/post_resp.json
              exit 1
            fi
          }

          # Convenience wrapper: reconcile on the staging project. Defaults
          # to production+preview scope on the staging project so every
          # deploy of this project (regardless of branch) gets the same
          # isolation vars.
          upsert_env() { reconcile_env "${PROJECT_ID}" "$@"; }

          # Staging isolation vars.
          upsert_env "APP_ENV" "staging" "plain"
          upsert_env "EXPO_PUBLIC_APP_ENV" "staging" "plain"
          upsert_env "EXPO_PUBLIC_SITE_URL" "https://${STAGING_HOST}" "plain"
          upsert_env "KV_REST_API_URL" "${KV_REST_API_URL}" "encrypted"
          upsert_env "KV_REST_API_TOKEN" "${KV_REST_API_TOKEN}" "encrypted"
          upsert_env "AUTH_SESSION_SECRET_STAGING" "${AUTH_SESSION_SECRET_STAGING}" "encrypted"
          upsert_env "PUSH_NOTIFY_SECRET_STAGING" "${PUSH_NOTIFY_SECRET_STAGING}" "encrypted"
          # EXPO_STAGING_TEST_TOKENS: an EMPTY value now DELETES the stale
          # allowlist on the staging-scoped entry — a synth-only lane with
          # no listed tokens sends to nobody, exactly as push-staging-guard
          # enforces (rework 4th pass — blocker #2b).
          upsert_env "EXPO_STAGING_TEST_TOKENS" "${EXPO_STAGING_TEST_TOKENS:-}" "plain"
          upsert_env "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" "${EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID:-}" "encrypted"
          upsert_env "GOOGLE_WEB_CLIENT_ID" "${GOOGLE_WEB_CLIENT_ID:-}" "encrypted"
          upsert_env "GEMINI_API_KEY" "${GEMINI_API_KEY:-}" "encrypted"

      # ── Step 6: set APP_ENV=production on prod project (production only) ─
      # Rework 4th pass — blocker #2c: locate the entry by key AND
      # target=["production"] AND gitBranch=null so we mutate the actual
      # production-scoped entry rather than the first APP_ENV key match
      # (which might be a preview-scoped or branch-scoped entry the
      # operator added deliberately). Preview deployments (feature
      # branches, PRs on holocard-hunter) are NOT forced to
      # APP_ENV=production — they can opt-in per-branch or inherit the
      # fail-closed behavior. Uses the same scope-aware reconcile_env
      # helper as the staging project so preview/branch entries are
      # preserved.
      - name: Set APP_ENV=production on holocard-hunter (production target only)
        if: env.PROD_PROJECT_ID != '' && inputs.apply == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          # Inline scope-aware reconcile: find the entry whose target is
          # exactly ["production"] and gitBranch is null. Do NOT touch a
          # preview-scoped or branch-scoped APP_ENV.
          listing=$(curl -sS $CURL_OPTS --oauth2-bearer "${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${PROD_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}")
          match=$(echo "$listing" | node -pe '
            const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
            const wantTargets = JSON.stringify(["production"]);
            const e = (d.envs||[]).find(x =>
              x.key === "APP_ENV" &&
              JSON.stringify((x.target||[]).slice().sort()) === wantTargets &&
              (x.gitBranch == null || x.gitBranch === "")
            );
            e ? JSON.stringify({ id: e.id, type: e.type, value: e.value || "" }) : "";
          ' 2>/dev/null || echo "")

          if [ -n "$match" ]; then
            cur_id=$(echo "$match" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).id')
            cur_type=$(echo "$match" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).type')
            cur_val=$(echo "$match" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')
            if [ "$cur_type" = "plain" ] && [ "$cur_val" = "production" ]; then
              echo "APP_ENV=production on production-scoped entry already correct — no-op."
              exit 0
            fi
            # PATCH the production-scoped entry ONLY.
            patch_body='{"value":"production","type":"plain","target":["production"]}'
            code=$(curl -sS $CURL_OPTS -o /tmp/patch_resp.json -w '%{http_code}' -X PATCH \
              --oauth2-bearer "${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-raw "$patch_body" \
              "https://api.vercel.com/v9/projects/${PROD_PROJECT_ID}/env/${cur_id}?teamId=${VERCEL_ORG_ID}")
            echo "PATCH prod APP_ENV (production-scoped entry ${cur_id}) → HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Failed to update prod APP_ENV (HTTP $code). Body:"; cat /tmp/patch_resp.json; exit 1
            fi
          else
            # No production-scoped entry yet: POST one. Any pre-existing
            # preview-scoped or branch-scoped APP_ENV entries are LEFT
            # ALONE (they may be operator-configured for a different lane).
            post_body='{"key":"APP_ENV","value":"production","type":"plain","target":["production"]}'
            code=$(curl -sS $CURL_OPTS -o /tmp/post_resp.json -w '%{http_code}' -X POST \
              --oauth2-bearer "${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-raw "$post_body" \
              "https://api.vercel.com/v10/projects/${PROD_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}")
            echo "POST prod APP_ENV (production-scoped) → HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Failed to set prod APP_ENV (HTTP $code). Body:"; cat /tmp/post_resp.json; exit 1
            fi
          fi

          # Validate: refetch and confirm the production-scoped entry now
          # reads APP_ENV=production; unrelated scopes preserved.
          verify=$(curl -sS $CURL_OPTS --oauth2-bearer "${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${PROD_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}")
          ok=$(echo "$verify" | node -pe '
            const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
            const e = (d.envs||[]).find(x =>
              x.key === "APP_ENV" &&
              JSON.stringify((x.target||[]).slice().sort()) === JSON.stringify(["production"]) &&
              (x.gitBranch == null || x.gitBranch === "")
            );
            if (!e) { console.log("missing"); process.exit(0); }
            if (e.type !== "plain") { console.log("type_mismatch"); process.exit(0); }
            if (String(e.value||"") !== "production") { console.log("value_mismatch"); process.exit(0); }
            console.log("ok");
          ')
          if [ "$ok" != "ok" ]; then
            echo "::error::Post-write validation failed for prod APP_ENV: $ok"
            exit 1
          fi
          echo "APP_ENV=production wired on production target ONLY (preview / branch scopes unchanged)."

      # ── Step 7: attach test.holohunter.dicoge.com ───────────────────────
      - name: Attach test.holohunter.dicoge.com domain
        if: env.PROJECT_ID != '' && inputs.apply == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          exists=$(curl -sS $CURL_OPTS --oauth2-bearer "${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}")
          already=$(echo "$exists" | node -pe '
            const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
            (d.domains||[]).some(x => x.name === process.argv[1]) ? "yes" : "no";
          ' "${STAGING_HOST}" 2>/dev/null || echo "no")
          if [ "$already" = "yes" ]; then
            echo "Domain ${STAGING_HOST} already attached — no-op."
          else
            code=$(curl -sS $CURL_OPTS -o /tmp/domain_resp.json -w '%{http_code}' -X POST \
              --oauth2-bearer "${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-raw "$(node -e 'console.log(JSON.stringify({ name: process.argv[1] }))' "${STAGING_HOST}")" \
              "https://api.vercel.com/v10/projects/${PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}")
            echo "attach domain → HTTP $code"
            cat /tmp/domain_resp.json
            if [ "$code" = "409" ]; then
              echo "::error::${STAGING_HOST} attached to a different project — refusing to override."
              exit 1
            fi
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Failed to attach domain (HTTP $code)."
              exit 1
            fi
          fi
          echo "Expected DNS: CNAME ${STAGING_HOST} → ${VERCEL_CNAME_TARGET}"

      # ── Step 8: add CNAME on dicoge.com with existing-record validation ─
      - name: Ensure CNAME test.holohunter → cname.vercel-dns.com
        if: env.PROJECT_ID != '' && inputs.apply == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          existing=$(curl -sS $CURL_OPTS --oauth2-bearer "${VERCEL_TOKEN}" \
            "https://api.vercel.com/v4/domains/${APEX_DOMAIN}/records?teamId=${VERCEL_ORG_ID}&limit=500")
          match_json=$(echo "$existing" | node -pe '
            const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
            const recs = d.records || [];
            const wanted = process.argv[1];
            const m = recs.filter(r => r.name === wanted || r.name === wanted + ".");
            JSON.stringify(m.map(r => ({ id: r.id, type: r.type, value: (r.value||"").replace(/\.$/, "") })));
          ' "test.holohunter")
          conflict=$(echo "$match_json" | node -pe '
            const arr = JSON.parse(require("fs").readFileSync(0,"utf8"));
            const wantedTarget = process.argv[1].replace(/\.$/, "");
            const good = arr.find(r => r.type === "CNAME" && r.value === wantedTarget);
            const bad = arr.find(r => r.type !== "CNAME" || (r.type === "CNAME" && r.value !== wantedTarget));
            good ? "already" : (bad ? "conflict" : "absent");
          ' "${VERCEL_CNAME_TARGET}")
          if [ "$conflict" = "already" ]; then
            echo "CNAME already correct — no-op."
            exit 0
          fi
          if [ "$conflict" = "conflict" ]; then
            echo "::error::Conflicting DNS record for test.holohunter.${APEX_DOMAIN}. Records: $match_json"
            exit 1
          fi
          add_body=$(node -e '
            console.log(JSON.stringify({
              name: "test.holohunter", type: "CNAME",
              value: process.argv[1], ttl: 3600,
              comment: "DIC-1189 staging — added by dic1189 workflow"
            }));
          ' "${VERCEL_CNAME_TARGET}")
          code=$(curl -sS $CURL_OPTS -o /tmp/dns_resp.json -w '%{http_code}' -X POST \
            --oauth2-bearer "${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw "$add_body" \
            "https://api.vercel.com/v2/domains/${APEX_DOMAIN}/records?teamId=${VERCEL_ORG_ID}")
          echo "POST DNS record → HTTP $code"
          cat /tmp/dns_resp.json
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Failed to add CNAME (HTTP $code)."
            exit 1
          fi

      # ── Step 9: trigger fresh staging deployment ────────────────────────
      - name: Trigger staging deployment
        id: deploy
        if: env.PROJECT_ID != '' && inputs.apply == true && inputs.redeploy == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          latest=$(curl -sS $CURL_OPTS --oauth2-bearer "${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&target=production&limit=1&teamId=${VERCEL_ORG_ID}")
          uid=$(echo "$latest" | node -pe '
            const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
            (d.deployments && d.deployments[0] && d.deployments[0].uid) || ""
          ')
          name=$(echo "$latest" | node -pe '
            const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
            (d.deployments && d.deployments[0] && d.deployments[0].name) || ""
          ')
          if [ -z "$uid" ]; then
            echo "::error::No prior staging deployment exists — push to staging branch first."
            exit 1
          fi
          code=$(curl -sS $CURL_OPTS -o /tmp/redeploy_resp.json -w '%{http_code}' -X POST \
            --oauth2-bearer "${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw "$(node -e '
              console.log(JSON.stringify({ name: process.argv[1], deploymentId: process.argv[2], target: "production" }));
            ' "$name" "$uid")" \
            "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_ORG_ID}")
          echo "Redeploy → HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Failed to trigger redeploy (HTTP $code)."
            cat /tmp/redeploy_resp.json
            exit 1
          fi
          deployment_id=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/redeploy_resp.json","utf8")).id || ""')
          echo "DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"

      # ── Step 10: bounded poll for deployment READY ──────────────────────
      - name: Poll deployment until READY (bounded)
        if: env.PROJECT_ID != '' && inputs.apply == true && inputs.redeploy == true && env.DEPLOYMENT_ID != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 480))
          while [ $SECONDS -lt $deadline ]; do
            resp=$(curl -sS $CURL_OPTS --oauth2-bearer "${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}")
            state=$(echo "$resp" | node -pe 'try { JSON.parse(require("fs").readFileSync(0,"utf8")).readyState || "" } catch { "" }')
            echo "state = $state"
            case "$state" in
              READY) exit 0 ;;
              ERROR|CANCELED) echo "::error::Deployment $state"; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          echo "::error::Deployment did not reach READY within 8 minutes."
          exit 1

      # ── Step 11: smoke test — FATAL asserts against expected SHA ────────
      - name: Smoke test staging URL (fatal, bounded, exact SHA)
        if: env.PROJECT_ID != '' && inputs.apply == true && inputs.redeploy == true && env.DEPLOYMENT_ID != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          resp=$(curl -sS $CURL_OPTS --oauth2-bearer "${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${DEPLOYMENT_ID}?teamId=${VERCEL_ORG_ID}")
          expected_sha=$(echo "$resp" | node -pe '
            const d = JSON.parse(require("fs").readFileSync(0,"utf8"));
            const s = (d.meta && (d.meta.githubCommitSha || d.meta.gitCommitSha)) || "";
            s.slice(0, 12);
          ')
          if [ -z "$expected_sha" ]; then
            echo "::error::Could not determine expected git SHA."; exit 1
          fi
          echo "expected_sha=$expected_sha"
          url="https://${STAGING_HOST}/"
          deadline=$((SECONDS + 300)); code=""
          while [ $SECONDS -lt $deadline ]; do
            code=$(curl -sS -o /tmp/staging.html -w '%{http_code}' --connect-timeout 5 --max-time 15 -L "$url" || echo "000")
            [ "$code" = "200" ] && break
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "::error::Staging URL did not return 200."; exit 1
          fi
          curl -sSI --connect-timeout 5 --max-time 15 -L "$url" > /tmp/head.txt || { echo "::error::TLS/HEAD failed."; exit 1; }
          grep -q 'name="robots" content="noindex,nofollow"' /tmp/staging.html || { echo "::error::robots noindex missing"; exit 1; }
          grep -q 'name="app-env" content="staging"' /tmp/staging.html || { echo "::error::app-env=staging missing"; exit 1; }
          if ! grep -q "name=\"staging-sha\" content=\"${expected_sha}\"" /tmp/staging.html; then
            echo "::error::staging-sha != ${expected_sha}"
            grep -oE 'name="staging-sha" content="[^"]+"' /tmp/staging.html || true
            exit 1
          fi
          echo "  ✅ smoke pass: 200 + TLS + noindex + app-env=staging + staging-sha=${expected_sha}"

      # ── Step 12: production non-regression (ALWAYS runs) ────────────────
      - name: Production non-regression check (always)
        if: always()
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/prod.html -w '%{http_code}' --connect-timeout 5 --max-time 15 -L "https://holohunter.dicoge.com/" || echo "000")
          if [ "$code" != "200" ]; then echo "::error::Prod URL != 200 (got $code)"; exit 1; fi
          for pat in 'name="app-env" content="staging"' 'name="robots" content="noindex' 'name="staging-sha"' 'TEST · 測試環境'; do
            if grep -q "$pat" /tmp/prod.html; then
              echo "::error::Production HTML contains staging marker: $pat"; exit 1
            fi
          done
          echo "  ✅ production HTML free of staging markers"
