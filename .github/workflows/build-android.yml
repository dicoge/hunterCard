name: Build Android APK (DEBUG-ONLY)

# ⚠️ DEBUG-ONLY. This workflow runs `assembleDebug`: the APK it produces is
# signed with the Android **debug** keystore and is a smoke-test artifact for
# CI only. It is NOT a release build and must never be handed to a tester or
# described as a 正式內容測試包 (DIC-1193).
#
# The production-content, release-signed APK comes from the `EAS Build (Test
# Tracks)` workflow with profile `production-apk` — see docs/TEST-DISTRIBUTION.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (DEBUG-ONLY)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo native-module compatibility (DIC-969)
        run: npm run test:expo-native-compat

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          # Install command-line tools
          ANDROID_HOME=$HOME/android-sdk
          SDK_TOOLS=$ANDROID_HOME/cmdline-tools/latest
          mkdir -p $SDK_TOOLS

          # Download Android command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/
          mv /tmp/cmdline-tools/* $SDK_TOOLS/
          rm -f /tmp/cmdline-tools.zip

          # Accept licenses and install SDK
          yes | $SDK_TOOLS/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK_TOOLS/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" > /dev/null 2>&1 || true

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      # EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID is a PUBLIC OAuth client id (safe to embed
      # in the app). Native Android Google Sign-In needs it so the ID token's `aud`
      # is the audience the backend verifies; without it the APK ships and Google
      # login fails at runtime with `client_id_missing`. ASSERT_GOOGLE_WEB_CLIENT=1
      # makes app.config.js fail the build loudly if the secret is absent (DIC-665
      # / DIC-920 blocker 1) rather than producing a broken login APK.
      - name: Prebuild (generate native android project)
        env:
          ASSERT_GOOGLE_WEB_CLIENT: '1'
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: npx expo prebuild --platform android --no-install

      - name: Build Android debug APK
        env:
          ASSERT_GOOGLE_WEB_CLIENT: '1'
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Label artifact as debug-only
        run: |
          set -euo pipefail
          cat > android/app/build/outputs/apk/debug/DEBUG-ONLY.txt <<EOF
          DEBUG-ONLY — NOT A RELEASE BUILD (DIC-1193)

          This APK was produced by \`./gradlew assembleDebug\` and is signed with the
          Android debug keystore. It exists to prove the native Android project still
          compiles. Do not install it as a 正式內容測試包, do not send it to testers,
          and do not describe it as "the production APK".

          The production-content, release-signed APK comes from the
          "EAS Build (Test Tracks)" workflow with profile \`production-apk\`.

          commit: ${GITHUB_SHA}
          run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          echo "::warning::This APK is DEBUG-ONLY (debug keystore). Use the production-apk EAS profile for tester builds."

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: holohunter-DEBUG-ONLY-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/DEBUG-ONLY.txt
          retention-days: 7