  release-apk-postpackage-guard:
    # DIC-1266 CR round 7 / DIC-1277 QA blocker: generated Gradle text
    # can pass the fast static suite while the packaged APK still ships
    # every ABI, because the RN gradle plugin's
    # NdkConfiguratorUtils.kt calls
    # `abiFilters.addAll(reactNativeArchitectures)` — unioning the
    # gradle.properties list onto the DSL filter. The ONLY check that
    # is not fooled by that is a real `./gradlew app:assembleRelease`
    # against the plugin, followed by a byte-level inspection of the
    # produced APK's lib/<abi>/ directories and total size. Runs in
    # parallel with Validate.
    name: Release-APK post-package guard (DIC-1266 / DIC-1277)
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Temurin — matches EAS build image)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (pinned; no legacy `tools` package, DIC-1443)
        run: |
          set -euo pipefail
          ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # `android-actions/setup-android@v3` asked sdkmanager for the legacy
          # `tools` package, which Google removed from the repository
          # (`Warning: Failed to find package 'tools'`, DIC-1443). Pin the
          # explicit packages the release build needs instead; gradle
          # auto-provisions NDK/CMake under $ANDROID_HOME as before.
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Prebuild for production-apk profile
        env:
          EAS_BUILD_PROFILE: production-apk
          EAS_BUILD_PLATFORM: android
          # Placeholder — the plugin's Android build assertion in
          # app.config.js needs the env set; the value is never read at
          # release time by the guard itself.
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: dic1266-postpackage-guard-placeholder
        run: npx expo prebuild --platform android --no-install --clean

      - name: Assemble release APK
        env:
          # Set on the JVM so gradle daemons never leak between jobs.
          _JAVA_OPTIONS: "-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew app:assembleRelease --no-daemon --console=plain --stacktrace

      - name: Verify packaged ABI set + size (DIC-1277 blocker)
        run: npm run test:release-apk-postpackage

      - name: Upload built APK for provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

  # DIC-1430 Actions registry recovery — the registered-CI trampoline.
  #
  # `.github/workflows/holohunter-exact-sha-deploy.yml` exists on the default
  # branch at a reviewed blob and actionlint reports it clean, but GitHub's
  # Actions workflow registry never registered it: its filename endpoint 404s
  # and it cannot be dispatched directly. This workflow IS registered, so it
  # becomes the entry point and CALLS the reviewed production workflow.
  #
  # What this job is NOT: a copy of the deployment logic. It declares no steps
  # and no runner. Every exact-main check, the fresh pinned Vercel deployment,
  # the READY/target/source-SHA proof, the canonical-alias binding gate and
  # all the log-injection defences stay in the reviewed file and are invoked
  # from here unchanged.
  #
  # Why the `if:` names all three results explicitly: adding a job-level `if:`
  # REMOVES the implicit `success()` that `needs:` would otherwise apply, so a
  # bare `needs:` plus a condition would let this job run after a FAILED gate.
  # The event and intent terms make it unreachable on push/pull_request, where
  # `inputs` does not exist and nobody can set the flag.
  deploy-production:
    name: Deploy the exact SHA to Production (DIC-1430)
    needs: [preflight, validate, release-apk-postpackage-guard]
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.deploy_production
      && needs.preflight.result == 'success'
      && needs.validate.result == 'success'
      && needs['release-apk-postpackage-guard'].result == 'success'
    uses: ./.github/workflows/holohunter-exact-sha-deploy.yml
    with:
      # Forwarded verbatim. The callee re-proves it is 40 lowercase hex, equal
      # to github.sha, equal to the checked-out HEAD, and the live tip of
      # origin/main before it creates anything.
      expected_sha: ${{ inputs.expected_sha }}
    # Explicit, not `inherit`: the callee declares exactly these two as
    # required, and `inherit` would hand it every secret in the repository.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
