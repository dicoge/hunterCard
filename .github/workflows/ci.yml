name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:
    # DIC-1189: `staging` added so PRs into the isolated staging branch get
    # the same Validate gate as PRs into main. Main-side contract unchanged.
    branches: [main, staging]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.6+ is required for `node --experimental-strip-types`, used by the
          # mapper I/O regression in test:market-fields (and test:scan-dedup). Node 20
          # rejects the flag with "bad option", so the Validate job must run on 22.
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify Expo native-module compatibility (DIC-969)
        run: npm run test:expo-native-compat

      - name: Verify release APK pipeline invariants (DIC-1193)
        run: npm run test:release-apk-pipeline

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Verify interface i18n key parity and source coverage (DIC-1085)
        run: npm run test:i18n

      - name: Verify provider ID-token audience acceptance (DIC-665)
        run: npm run test:verify-token

      - name: Verify platform login-surface routing (DIC-665)
        run: npm run test:auth-strategy

      - name: Verify Web/Android Apple server-callback OAuth (DIC-960)
        run: npm run test:apple-web-oauth

      - name: Verify Android Apple App Link + exchange-code fail-closed (DIC-960)
        run: npm run test:apple-android-applink

      - name: Verify native/web API base resolution (DIC-922)
        run: npm run test:api-base

      - name: Verify deterministic web OAuth redirect URI (DIC-922)
        run: npm run test:web-redirect

      - name: Verify web-Google redirect callback leg (DIC-976)
        run: npm run test:web-google-callback

      - name: Verify web-Google link redirect start (DIC-976)
        run: npm run test:auth-link-start

      - name: Verify callback vs persisted-session validation ordering (DIC-976)
        run: npm run test:auth-redirect-race

      - name: Verify session survives a malformed OAuth callback (DIC-976)
        run: npm run test:auth-callback-recovery

      - name: Verify friendly-but-safe auth error mapping (DIC-922)
        run: npm run test:auth-error-map

      - name: Verify login-gate auth store never leaks raw errors (DIC-928)
        run: npm run test:auth-store-error-wiring

      - name: Verify iOS/Android build fail-closed client guards (DIC-922)
        run: npm run test:ios-build-guard

      - name: Verify native Google Sign-In logout / account switch (DIC-665)
        run: npm run test:google-signout

      - name: Verify server-side ID-token single-use replay protection (DIC-665)
        run: npm run test:token-replay

      - name: Verify buy-price version alignment (DIC-856)
        run: npm run test:buy-price

      - name: Verify buy-price regeneration is deterministic (DIC-856)
        run: npm run test:buy-price-regen

      - name: Verify scrape pipeline fail-fast + atomic commit ordering (DIC-989)
        run: npm run test:scrape-pipeline

      - name: Verify scan/search market data fields (DIC-361)
        run: npm run test:market-fields

      - name: Verify canonical printing-ID rebuilds preserve market fields (DIC-1204)
        run: npm run test:market-field-preservation

      - name: Audit normalized card labels, subscriber provenance, and exact-printing trends (DIC-1084)
        run: npm run test:card-data-audit

      - name: Verify trend math/UI and subscriber provenance are mutation-sensitive (DIC-1084)
        run: npm run test:card-data-correctness

      - name: Verify Holomen Bloom Level badge never falls back to "Holomen" (DIC-1141)
        run: npm run test:dic1141-bloom-level

      - name: Verify Bloom Level scraper preserves canonical + overlay loader fails closed (DIC-1141 CR)
        run: npm run test:dic1141-scrape-bloom-safety

      # DIC-1192 CR add-on: the hBP02-003 signed-row provenance regression + the
      # DIC-1084 yuyu-tei short-suffix canonicalizer sit inside one suite that
      # was previously not on the Validate path — a stale $62,000/yuyu assertion
      # from before the 18h freshness contract went red only when Codex ran it
      # by hand at PR #153 exact-head. Wiring it into Validate is the guard.
      - name: Verify canonical-printings + card-number canonicalizer regression (DIC-1139/1140/1084)
        run: npm run test:canonical-printings

      # DIC-1150 + DIC-1192 mobile/desktop grid + colour token normalisation.
      # The three suites move together: uniform-card-grid locks the row-math
      # helper, search-results-layout renders the real screen at 390/1440 to
      # prove the `flex-basis:auto` single-column fix AND the `◇ → colorless`
      # normalisation, and dic1192-color-normalization locks the shared
      # normaliser contract + i18n key parity.
      - name: Verify uniform grid item row math (DIC-1088 + DIC-1150)
        run: npm run test:uniform-card-grid

      - name: Verify real SearchResultsScreen grid geometry + colour render (DIC-1150 + DIC-1192)
        run: npm run test:search-results-layout

      - name: Verify colour token normaliser + KNOWN_COLOR_KEYS ↔ i18n parity (DIC-1192)
        run: npm run test:dic1192-color-normalization

      # The visual card picker shares uniformGridItemStyle with the search
      # results grid; a mutation in gridLayout that only breaks CardPicker
      # would slip past search-results-layout otherwise.
      - name: Verify visual card picker deck-building surface (DIC-1067)
        run: npm run test:card-picker

      - name: Verify SearchResults/CardDetail color label survives ◇/blue_red source values (DIC-1159)
        run: npm run test:dic1159-unknown-color

      - name: Verify production /api/* is not swallowed by SPA (DIC-886)
        run: npm run test:vercel-routing

      - name: Verify Node-runtime API routes export toNodeHandler (DIC-1043)
        run: npm run test:node-runtime-adapter

      - name: Verify Store MVP fail-closed field strip (DIC-908)
        run: npm run test:store-mvp-strip

      - name: Verify native asset == sanitizeDatabase(canonical) (DIC-916)
        run: node scripts/generate-native-database.mjs --check

      - name: Verify real Android export is fail-closed (DIC-916)
        run: npm run test:store-mvp-native-export

      - name: Verify configured Vercel web export produces a sanitized artifact end-to-end (DIC-1140)
        run: npm run test:web-export-artifact

      - name: Verify native guest series/card data loads fail-closed (DIC-972)
        run: npm run test:native-guest-data

      - name: Verify deck editor rules engine (DIC-945)
        run: npm run test:deck-rules

      - name: Verify tournament report pipeline core (DIC-979)
        run: npm run test:tournament-report

      - name: Verify verified tournament deck one-tap import fail-closed (DIC-1033)
        run: npm run test:tournament-deck-import

      - name: Verify the frozen price fixture still describes the repo (DIC-1127)
        run: npm run test:frozen-prices

      - name: Verify tournament import defaults to the lowest ordinary printing (DIC-1060)
        run: npm run test:tournament-printing-default

      - name: Verify the deck editor renders no explanatory copy (DIC-1064)
        run: npm run test:deck-editor-copy

      - name: Verify strict card-number series filter + numeric ordering (DIC-1117)
        run: npm run test:series-filter

      - name: Verify tournament collector failure preservation (DIC-979)
        run: npm run test:tournament-collector

      - name: Verify deterministic tournament deck analytics (DIC-1032)
        run: npm run test:tournament-analytics

      - name: Verify observed-share donut model, geometry and filtering (DIC-1066)
        run: npm run test:tournament-donut

      - name: Verify deck editor price adapter fail-closed (DIC-952)
        run: npm run test:deck-price-adapter

      - name: Verify deck rename persistence + empty-name rejection (DIC-957)
        run: npm run test:deck-store-rename

      - name: Verify global collection + missing-card estimate (DIC-978)
        run: npm run test:deck-collection

      - name: Verify low-cost default printing resolver (DIC-1004)
        run: npm run test:deck-variants

      - name: Verify desired-price interval alerts (DIC-1023)
        run: npm run test:price-alerts

      - name: Verify server price-alert evaluator dedupe/re-arm/claim (DIC-1023)
        run: npm run test:price-alert-run

      - name: Verify legacy tracking migration, dedupe and version isolation (DIC-1087)
        run: npm run test:alert-unification

      - name: Verify the alerts page is one feature end to end (DIC-1087)
        run: npm run test:alert-unification-e2e

      - name: Verify push notification backend (DIC-390)
        run: npm run test:push-backend

      - name: Verify card-lookup version alignment is source-proven (DIC-1013)
        run: npm run test:version-alignment

      - name: Verify per-cardNumber row order keeps CardDetail == deck (DIC-1167)
        run: npm run test:detail-deck-alignment-order

      - name: Verify price-history provenance rejects cross-product records (DIC-1219)
        run: npm run test:price-history-provenance

      - name: Verify scheduler fails closed on tracked/staged/untracked residue (DIC-1219)
        run: npm run test:scheduler-dirty-precondition

      - name: Verify yuyu-provenance gate blocks cross-product preservation (DIC-1227)
        run: npm run test:yuyu-provenance-preservation

      - name: Verify unproven printings cannot ship priceHistory (DIC-1229)
        run: npm run test:dic1229-history-provenance

      - name: Verify scan totals fail closed on unresolved versions (DIC-1013)
        run: npm run test:scan-fail-closed

      - name: Verify an unprovisioned recognition backend is not blamed on the photo (DIC-1013)
        run: npm run test:recognition-unavailable

      - name: Verify recognition provider priority, fallback and key isolation (DIC-1019)
        run: npm run test:recognition-provider

      - name: Verify an illegible photo is refused instead of matched (DIC-1021)
        run: npm run test:recognition-image-quality

      - name: Verify commercialization static HTML No-JS and copy-assets manifest (DIC-1157)
        run: npm run test:dist-nojs

      - name: Verify AdSlot real component render and fail-closed safety (DIC-1157)
        run: npm run test:adslot-render

      - name: Verify the Play release manifest requests no unjustified permission (DIC-1248)
        run: npm run test:play-manifest

      - name: Verify the privacy policy matches what the code actually sends off-device (DIC-1248)
        run: npm run test:privacy-disclosure

      - name: Check for console.log statements
        run: |
          CONSOLE_LOGS=$(grep -r "console.log" src/ --include="*.ts" --include="*.tsx" || true)
          if [ -n "$CONSOLE_LOGS" ]; then
            echo "Warning: Found console.log statements:"
            echo "$CONSOLE_LOGS"
          fi
