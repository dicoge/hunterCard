name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:
    # DIC-1189: `staging` added so PRs into the isolated staging branch get
    # the same Validate gate as PRs into main. Main-side contract unchanged.
    branches: [main, staging]
  # DIC-1430 CI/CD recovery: a manual entry point for the case where a merge
  # to main produced no PushEvent and therefore no CI run at all (PR #193
  # merged as defa9592… and Actions never fired; cause still unknown). The
  # operator must name the exact commit, so a recovery run can never be
  # aimed at "whatever main happens to be right now".
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full lowercase 40-hex commit SHA that MUST be the current tip of main"
        type: string
        required: true
      # DIC-1430 Actions registry recovery: explicit, separate deploy intent.
      # It defaults to FALSE and is readable only on a workflow_dispatch, so
      # an ordinary push or pull_request cannot set it and an operator who
      # just wants a manual CI run never touches Production. Deploying is a
      # second, deliberate decision — never a side effect of running CI.
      deploy_production:
        description: "Deploy the verified expected_sha to Production after all gates pass"
        type: boolean
        required: false
        default: false

jobs:
  # DIC-1430: gate for manual recovery dispatches.
  #
  # This job has NO job-level `if:` on purpose. A skipped job counts as
  # "not successful" for everything that `needs:` it, so an event-gated
  # preflight would silently skip Validate and the APK guard on every
  # ordinary push and pull request — CI would report green without having
  # run. Instead the job always runs and no-ops INTERNALLY for push/PR,
  # which keeps the existing push/PR contract byte-for-byte intact while
  # still letting both real jobs depend on it.
  preflight:
    name: Recovery preflight (exact-main dispatch gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gate manual dispatches on the exact current tip of main
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail

          # Normal push / pull_request runs: explicit, successful no-op.
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Event '${EVENT_NAME}' is an ordinary push/pull_request run — preflight is a deliberate no-op."
            exit 0
          fi

          echo "Manual recovery dispatch — verifying the requested commit."

          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::expected_sha must be a full lowercase 40-hex commit SHA (got a value of length ${#EXPECTED_SHA})."
            exit 1
          fi

          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::Recovery dispatches are only valid against refs/heads/main (got ${DISPATCH_REF})."
            exit 1
          fi

          if [ "$EXPECTED_SHA" != "$DISPATCH_SHA" ]; then
            echo "::error::expected_sha does not match the dispatched commit (${DISPATCH_SHA})."
            exit 1
          fi

          # The dispatched SHA can already be stale by the time the runner
          # starts. The live remote tip is the only authority on what main is.
          remote_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$remote_sha" ]; then
            echo "::error::expected_sha is not the live tip of origin/main (live tip is ${remote_sha})."
            exit 1
          fi

          echo "Verified: ${EXPECTED_SHA} is the exact current tip of main."

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [preflight]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.6+ is required for `node --experimental-strip-types`, used by the
          # mapper I/O regression in test:market-fields (and test:scan-dedup). Node 20
          # rejects the flag with "bad option", so the Validate job must run on 22.
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify Expo native-module compatibility (DIC-969)
        run: npm run test:expo-native-compat

      - name: Verify release APK pipeline invariants (DIC-1193)
        run: npm run test:release-apk-pipeline

      - name: Verify release APK size + content guards (DIC-1266)
        run: npm run test:release-apk-size-optim

      - name: Verify effective generated Gradle from real prebuild (DIC-1266 CR blocker 1/2)
        run: npm run test:release-apk-prebuild-effective

      - name: Verify post-package APK guard fails closed on size/manifest mutations (DIC-1266 CR round-6)
        run: npm run test:release-apk-postpackage-mutations

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Verify interface i18n key parity and source coverage (DIC-1085)
        run: npm run test:i18n

      - name: Verify provider ID-token audience acceptance (DIC-665)
        run: npm run test:verify-token

      - name: Verify platform login-surface routing (DIC-665)
        run: npm run test:auth-strategy

      - name: Verify Web/Android Apple server-callback OAuth (DIC-960)
        run: npm run test:apple-web-oauth

      - name: Verify Android Apple App Link + exchange-code fail-closed (DIC-960)
        run: npm run test:apple-android-applink

      - name: Verify native/web API base resolution (DIC-922)
        run: npm run test:api-base

      - name: Guard native bundle from old vercel.app origin (DIC-1245)
        run: npm run test:native-bundle-origin

      - name: Verify deterministic web OAuth redirect URI (DIC-922)
        run: npm run test:web-redirect

      - name: Verify web-Google redirect callback leg (DIC-976)
        run: npm run test:web-google-callback

      - name: Verify web-Google link redirect start (DIC-976)
        run: npm run test:auth-link-start

      - name: Verify callback vs persisted-session validation ordering (DIC-976)
        run: npm run test:auth-redirect-race

      - name: Verify session survives a malformed OAuth callback (DIC-976)
        run: npm run test:auth-callback-recovery

      - name: Verify friendly-but-safe auth error mapping (DIC-922)
