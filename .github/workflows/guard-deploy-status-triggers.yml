name: Guard deployment-class event triggers (DIC-1401)

# DIC-1401 Round-11 — the TRUSTED boundary for the repo-wide ban on
# `deployment_status` / `deployment` event triggers.
#
# WHY THIS GUARD IS NEEDED (Round-8/9/10 evidence)
# ---------------------------------------------------------------------
# GitHub loads a `deployment_status` workflow from the DEPLOYED ref
# — i.e. the PR head on a preview deploy. That means the workflow's
# whole YAML (including its `permissions:` block) is PR-controlled,
# so a PR author could recreate an `on: deployment_status` workflow
# that requests `contents: write` / `pull-requests: write` and
# receive that write token at the first Vercel deploy, BEFORE any CI
# check runs. Round-10's repo invariant lives inside ci.yml, which is
# itself PR-controlled YAML (loaded from the PR head): a PR could
# delete the assertion AND add a malicious workflow in the same diff.
#
# THIS FILE IS LOADED FROM THE BASE BRANCH. `pull_request_target`
# is the GitHub contract that resolves the workflow definition from
# the branch the PR targets (staging/main), never from the PR head.
# A PR author therefore cannot edit this guard, cannot rename it,
# and cannot delete the ci.yml step on a PR that re-adds a
# deployment-class trigger. Enforcing the merge gate here moves the
# boundary OUTSIDE PR-controlled YAML (CR requirement 1).
#
# HOW IT STAYS SAFE (it must never checkout the PR tree)
# ---------------------------------------------------------------------
# - NO actions/checkout, no `ref: github.event.*` bindings, no
#   execution of any repo-tree file. The only inputs are pulled from
#   the REST API with this workflow's own read-only token:
#   * `GET /repos/{o}/{repo}/pulls/{n}/files`  → changed filenames
#   * `GET /repos/{o}/{repo}/contents/<wf>?ref=<head sha>` → the
#     exact content of each changed `.github/workflows/*.yml` at the
#     PR head, so a workflow deleted-on-target is still audited.
# - Permissions are the intersection of exactly what those two calls
#   need: `contents: read` + `pull-requests: read`. No write scope
#   exists here to leak.
# - The scan is idempotent per PR (concurrency group keyed by PR
#   number) and only refuses a merge; it cannot itself post.
#
# LIMIT USES ARE EXPLICIT: this guard blocks the MERGE of a PR that
# reintroduces a deployment-class trigger. It cannot stop GitHub from
# momentarily running a malicious PR-head deployment_status workflow
# (that is inherent to GitHub's event model, so the policy is to make
# the existence of such a workflow a merge-blocking violation rather
# than fight the loader). It exists on staging AND main via the same
# PR patch, so whichever base a PR targets, the base-branch copy of
# this workflow governs.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: guard-deploy-status-triggers-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Provenance log (trusted base-branch guard)
        env:
          GUARD_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          echo "Guard workflow_ref: $GUARD_WORKFLOW_REF"

      - name: Fail PRs that add an event-triggered deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_REPO: ${{ github.repository }}
          GUARD_PR: ${{ github.event.pull_request.number }}
          GUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # ---- BEGIN GUARD SCAN (DIC-1401 round-11) ----
          set -euo pipefail
          : "${GUARD_REPO:?GUARD_REPO must be set}"
          : "${GUARD_PR:?GUARD_PR must be set}"
          : "${GUARD_HEAD_SHA:?GUARD_HEAD_SHA must be set}"
          echo "Guard scanning PR #$GUARD_PR head $GUARD_HEAD_SHA in $GUARD_REPO"

          CHANGED_FILES="$(gh api "repos/$GUARD_REPO/pulls/$GUARD_PR/files" --jq '.[].filename')"
          echo "Changed files:"
          printf '%s\n' "$CHANGED_FILES" | sed 's/^/  /'

          OFFENDER=no
          while IFS= read -r fname; do
            [ -n "$fname" ] || continue
            case "$fname" in
              .github/workflows/*.yml|.github/workflows/*.yaml) ;;
              *) continue ;;
            esac
            echo "Inspecting workflow $fname"
            B64="$(gh api "repos/$GUARD_REPO/contents/$fname?ref=$GUARD_HEAD_SHA" --jq '.content')"
            RAW="$(printf '%s' "$B64" | base64 -d)"
            # Strip comments (full-line + trailing) so rationale prose
            # can neither trip nor hide this scan.
            CLEAN="$(printf '%s\n' "$RAW" | sed -e 's/^[[:space:]]*#.*$//' -e 's/#.*$//')"
            # Collect the tokens mentioned in the `on:` block — its
            # inline value (scalar or `[a, b]` list, split on
            # space/[/]/[ ]/,) plus the direct child keys of a
            # block-map `on:`. Deeper nested keys (e.g. the
            # `branches:` under `push:`) are at a greater indent and
            # are deliberately excluded, so a job named "deployment"
            # elsewhere in the YAML can never false-flag.
            TOKENS="$(printf '%s\n' "$CLEAN" | awk '
              function lead(s,   i){ for(i=1;i<=length(s);i++) if(substr(s,i,1)!=" ") break; return i-1 }
              /^on:[[:space:]]*$/        { inOn=1; indent=-1; next }
              /^on:[[:space:]]+.*$/      {
                rest=$0; sub(/^on:[[:space:]]*/, "", rest); gsub(/[][,]/," ",rest);
                n=split(rest, a, " "); for(i=1;i<=n;i++) if(a[i]!="") print a[i];
                inOn=0; next
              }
              inOn==0                     { next }
              /^[^[:space:]]/             { inOn=0; next }
              {
                l=lead($0); line=$0; gsub(/^[[:space:]]*/, "", line);
                if (indent < 0) indent=l;
                if (l == indent && line != "") { sub(/:.*$/, "", line); print line }
                next
              }
            ')"
            if printf '%s\n' "$TOKENS" | grep -qx 'deployment_status' \
              || printf '%s\n' "$TOKENS" | grep -qx 'deployment'; then
              echo "::error::PR re-introduces a banned deployment-class event trigger in $fname (loaded from the DEPLOYED ref = PR head). Round-8/9: such workflows receive the requested permissions before CI can reject them. The repo bans on: deployment_status / on: deployment outside the default branch (DIC-1401)."
              OFFENDER=yes
            fi
          done <<< "$CHANGED_FILES"

          if [ "$OFFENDER" = "yes" ]; then
            exit 1
          fi
          echo "Guard OK: no PR workflow adds a deployment-class event trigger (DIC-1401)"
          # ---- END GUARD SCAN (DIC-1401 round-11) ----