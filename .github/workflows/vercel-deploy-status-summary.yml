name: Vercel deploy status summary

# DIC-1401 Round-9 PRODUCER (read-only bridge).
#
# TRUST BOUNDARY — READ THIS BEFORE ADDING SCOPES
# ---------------------------------------------------------------------
# On `deployment_status` events GitHub loads THIS workflow's YAML from
# the deployment's ref, which for Vercel preview deployments is the PR
# head SHA. That means this file itself is attacker-controlled — a PR
# author can rewrite everything below and it will execute (Mac-Codex
# Round-8 CR proved this empirically: main did not contain this file at
# round-8, yet the round-8 file executed at PR-head SHAs with write
# scope on runs 34273723734 and 34273978980).
#
# Consequently THIS workflow MUST NOT hold any repo write permission
# and MUST NOT be the workflow that posts a summary. Its only job is
# to marshal the `deployment_status` event data into an artifact for
# the trusted default-branch consumer
# (.github/workflows/vercel-deploy-status-post.yml) to pick up via
# `workflow_run`. `workflow_run` workflows are — by GitHub Actions
# contract — loaded from the DEFAULT branch, which cannot be modified
# by a PR before merge. That consumer holds the write scope; this
# producer stays contents:read only.
#
# If you are tempted to add `pull-requests: write` or
# `contents: write` here, DON'T. Add it to the consumer instead. Any
# reintroduction of a write scope on this file is caught by
# scripts/test-deploy-status-classify.mjs.
#
# Vercel-side reference:
#   Vercel emits `deployment_status.state` in
#     { pending, in_progress, success, error, failure } and
#   `deployment_status.environment` as
#     `Production – <project>` / `Preview – <project>` /
#     `Development – <project>` (U+2013 en-dash). Only success / error /
#   failure are worth mirroring; the rest are filtered at the job level.

on:
  deployment_status:

# Read-only. NO `contents: write`, NO `pull-requests: write`, NO
# `id-token: write`. This workflow is PR-controlled — see the trust
# boundary comment above. The test suite fails if any write scope is
# reintroduced.
permissions:
  contents: read

jobs:
  emit:
    runs-on: ubuntu-latest
    if: ${{ github.event.deployment_status.state == 'success' || github.event.deployment_status.state == 'error' || github.event.deployment_status.state == 'failure' }}
    steps:
      # Event fields are captured via step-level `env:` and marshalled
      # to JSON with jq's `--arg` (so any shell metacharacters in the
      # Vercel-supplied strings stay as literal data, never a shell
      # substitution). The artifact is picked up by the trusted
      # consumer's `workflow_run` step; the consumer re-classifies and
      # re-validates every field before doing anything with a write
      # token.
      - name: Emit deployment_status data to artifact
        env:
          STATE: ${{ github.event.deployment_status.state }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          DESCRIPTION: ${{ github.event.deployment_status.description }}
          DEPLOY_REF: ${{ github.event.deployment.ref }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          DEPLOY_STATUS_ID: ${{ github.event.deployment_status.id }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          LOG_URL: ${{ github.event.deployment_status.log_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deploy-status-event"
          jq -n \
            --arg state             "${STATE:-}" \
            --arg environment       "${ENVIRONMENT:-}" \
            --arg description       "${DESCRIPTION:-}" \
            --arg deploy_ref        "${DEPLOY_REF:-}" \
            --arg deploy_sha        "${DEPLOY_SHA:-}" \
            --arg deploy_status_id  "${DEPLOY_STATUS_ID:-}" \
            --arg deployment_id     "${DEPLOYMENT_ID:-}" \
            --arg log_url           "${LOG_URL:-}" \
            --arg target_url        "${TARGET_URL:-}" \
            '{
              state:            $state,
              environment:      $environment,
              description:      $description,
              deploy_ref:       $deploy_ref,
              deploy_sha:       $deploy_sha,
              deploy_status_id: $deploy_status_id,
              deployment_id:    $deployment_id,
              log_url:          $log_url,
              target_url:       $target_url
            }' > "$RUNNER_TEMP/deploy-status-event/event.json"
          cat "$RUNNER_TEMP/deploy-status-event/event.json"

      - name: Upload event artifact for the trusted default-branch consumer
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-status-event
          path: ${{ runner.temp }}/deploy-status-event/event.json
          if-no-files-found: error
          retention-days: 1
