plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.holohunter.ocrgeometry'
version = '1.0.0'

android {
  namespace "com.holohunter.ocrgeometry"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Same artifacts and versions expo-ocr-kit 0.1.4 already ships (Gradle resolves one copy).
  implementation("androidx.exifinterface:exifinterface:1.3.7")
  implementation("com.google.mlkit:text-recognition:16.0.1")
}
