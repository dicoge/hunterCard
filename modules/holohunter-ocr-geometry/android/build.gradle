plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.holohunter.ocrgeometry'
version = '1.0.0'

android {
  namespace "com.holohunter.ocrgeometry"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Same artifacts and versions expo-ocr-kit 0.1.4 already ships (Gradle resolves one copy).
  implementation("androidx.exifinterface:exifinterface:1.3.7")
  implementation("com.google.mlkit:text-recognition:16.0.1")
  // The automatic card scanner view: the same CameraX artifacts / version expo-camera
  // 17.0.10 already ships (Gradle resolves one copy).
  def camerax_version = "1.5.0-rc01"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
}
