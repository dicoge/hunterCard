<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="340" viewBox="0 0 390 340">
  <title>DIC-1160 PriceTrendBadge preview</title>
  <desc>DIC-1160 Phase 1 preview evidence — PriceTrendBadge trend variants rendered through the migrated AppIcon foundation. All four states (up/down/stable/insufficient) use SVG paths from iconRegistry; no OS emoji fallback.</desc>
  <rect x="0" y="0" width="390" height="340" fill="#0f0f23"/>
  <text x="32" y="48" fill="#ffffff" font-family="-apple-system, Roboto, sans-serif" font-size="20" font-weight="700">PriceTrendBadge — Mobile 390px Preview</text>
  <text x="32" y="74" fill="#a0aec0" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="400">Migrated from OS emoji (📈 📉 ➡️ 📊) → AppIcon SVG registry (trending-up / trending-down / minus / bar-chart-2).</text>
  <text x="32" y="96" fill="#a0aec0" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="400">Each badge preserves its brand colour + soft background from the original design; only the glyph surface changed.</text>
  <rect x="32" y="120" width="200" height="64" fill="#10b98115" stroke="#10b98133" rx="10"/>
